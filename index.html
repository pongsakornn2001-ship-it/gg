<title>EWO • เรือหลวงกระบี่ OPV-551</title>
<style>
:root{--bg:#eef1f6;--card:#fff;--ink:#0b1b3a;--mut:#5b6780;--navy:#0a1f44;--gold:#c9a227;--line:#cfd6e4;--red:#b3282d;--grn:#2e7d32;--amb:#b7791f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#060e20;--card:#0e1d3a;--ink:#e8edf7;--mut:#93a1bf;--line:#223560;--navy:#0a1f44}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Roboto,"Noto Sans Thai","Sarabun",sans-serif;font-size:15px}
header{background:var(--navy);color:#fff;padding:10px 14px;border-bottom:3px solid var(--gold);display:flex;align-items:center;gap:10px}
header b{letter-spacing:.08em;font-size:15px}header small{display:block;color:var(--gold);font-size:11px;letter-spacing:.12em}
.star{font-size:24px;color:var(--gold)}#emb{cursor:pointer;display:block}#emb img{height:46px;width:46px;object-fit:contain;display:block;background:#fff;border-radius:50%}
nav{position:sticky;top:0;z-index:5;background:var(--navy);display:flex;overflow-x:auto}
nav button{flex:1;min-width:max-content;background:none;border:0;border-bottom:3px solid transparent;color:#b9c4dd;padding:11px 14px;font:inherit;cursor:pointer}
nav button.on{color:var(--gold);border-color:var(--gold);font-weight:600}
main{max-width:1000px;margin:0 auto;padding:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:12px;margin-bottom:12px}
h2{margin:0 0 8px;font-size:15px;letter-spacing:.04em;color:var(--navy);border-left:4px solid var(--gold);padding-left:8px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) h2{color:var(--gold)}}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}
button.b{background:var(--navy);color:#fff;border:1px solid var(--gold);border-radius:4px;padding:7px 12px;font:inherit;cursor:pointer}
button.g{background:none;border:1px solid var(--line);color:var(--ink);border-radius:4px;padding:5px 9px;font:inherit;cursor:pointer}
button.x{color:var(--red)}
input,select,textarea{width:100%;padding:8px;border:1px solid var(--line);border-radius:4px;background:var(--card);color:var(--ink);font:inherit}
label{display:block;font-size:12px;color:var(--mut);margin:8px 0 3px}
.item{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.item:last-child{border:0}.mut{color:var(--mut);font-size:13px}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.days{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.day{border:1px solid var(--line);border-radius:6px;padding:8px}.day.today{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.day h3{margin:0 0 4px;font-size:13px;color:var(--gold)}
.tag{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;color:#fff}
.ok{background:var(--grn)}.warn{background:var(--amb)}.bad{background:var(--red)}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.thumbs img{width:84px;height:84px;object-fit:cover;border-radius:4px;border:1px solid var(--line)}
.eq img.ph{width:100%;flex:1;min-width:0;height:120px;object-fit:cover;border-radius:4px;margin-bottom:6px}
.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:left;white-space:nowrap}th{background:var(--navy);color:#fff}
.modal{position:fixed;inset:0;background:#000a;z-index:20;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:20px 10px}
.modal>div{background:var(--card);border-top:4px solid var(--gold);border-radius:6px;padding:14px;width:100%;max-width:520px}
.ship{overflow:auto;border:1px solid var(--line);border-radius:6px;background:linear-gradient(#17335f,#0a1f44);max-height:60vh}
.ship svg{display:block;min-width:100%}
.mk{cursor:pointer}.mk circle{stroke:#fff;stroke-width:1.5}
.zl{fill:#0a1f44;font-size:11px;font-weight:700;paint-order:stroke;stroke:#fff;stroke-width:3px}
.d{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--ink);margin:0 3px}.l{display:inline-block;width:26px;height:9px;border-radius:5px;background:var(--ink);margin:0 3px}.sp2{display:inline-block;width:12px}.fg{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}.fi{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:6px;padding:6px;font-size:13px}.fi svg{flex:none}
</style>
